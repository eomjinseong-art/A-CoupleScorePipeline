name: 일괄 블로그 발행 (큐 템플릿)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  batch-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: 큐를 블로그 템플릿으로 발행
        env:
          GH_TOKEN: ${{ github.token }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python batch_blog_publish.py
