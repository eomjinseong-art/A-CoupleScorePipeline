name: 그날의남녀 자동 업로드

on:
  schedule:
    # KST 09:00 → UTC 00:00. Threads·블로그만. YouTube는 올리지 않는다.
    - cron: '0 0 * * *'
    # KST 21:00 → UTC 12:00. YouTube Short 1편 + Threads·블로그.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      upload_youtube:
        description: "YouTube Short도 업로드 (하루 1편은 21:00 KST 예약만)"
        type: boolean
        default: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install requests pillow google-auth google-api-python-client openai gspread

      - name: 에피소드 자동 보충
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python generate_episodes.py

      - name: Run upload pipeline (영상 + 스레드 + 블로그)
        env:
          GCP_TTS_KEY: ${{ secrets.GCP_TTS_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          # 21:00 KST 예약이거나, 수동 실행에서 업로드를 켠 경우에만 YouTube.
          YOUTUBE_UPLOAD: ${{ (github.event.schedule == '0 12 * * *' || inputs.upload_youtube == true || inputs.upload_youtube == 'true') && 'true' || 'false' }}
        run: python main.py
