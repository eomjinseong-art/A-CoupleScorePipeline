name: 그날의남녀 자동 업로드

on:
  schedule:
    # KST 09:00 (오전 9시) → UTC 00:00
    - cron: '0 0 * * *'
    # KST 21:00 (오후 9시) → UTC 12:00
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install requests pillow google-auth google-api-python-client anthropic gspread

      - name: 에피소드 자동 보충
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python generate_episodes.py

      - name: Run upload pipeline (영상 + 스레드 + 블로그)
        env:
          GCP_TTS_KEY: ${{ secrets.GCP_TTS_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py
